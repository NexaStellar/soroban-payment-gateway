name: Bug report
description: Report incorrect contract behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Never include private keys, seed phrases, credentials, or real user data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal local test or steps using the Soroban test environment.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Rust and Soroban SDK versions
    validations:
      required: true
